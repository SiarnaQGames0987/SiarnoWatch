<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/swlogo.png?v=0551" />
  <title>Profile · SiarnoWatch</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="profile">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html"><img class="brand-logo" src="assets/swlogo.png?v=0551" alt="SiarnoWatch logo" width="36" height="36" /><span class="brand-text">SiarnoWatch</span></a>
      <nav class="nav">
        <a class="nav-item" href="index.html">⌂ <span>Home</span></a>
        <a class="nav-item" href="messages.html">✉ <span>Messages</span><b class="nav-badge hidden" data-message-badge>0</b></a>
        <a class="nav-item" href="notifications.html">♡ <span>Notifications</span><b class="nav-badge hidden" data-notification-badge>0</b></a>
        <a class="nav-item active" data-profile-link href="profile.html">◎ <span>Profile</span></a>
      </nav>
      <button class="account-button" data-auth-button>Log in</button>
      <div class="sidebar-footer">Mini social media.</div>
    </aside>

    <main class="feed-column">
      <header class="topbar profile-topbar"><a class="back" href="index.html">←</a><div><h1 id="profileTitle">Profile</h1><p id="profileCount">0 posts</p></div></header>
      <section class="profile-card">
        <div id="profileBanner" class="profile-banner"></div>
        <div class="profile-main">
          <div id="profileAvatar" class="avatar profile-avatar">?</div>
          <div class="profile-actions"><button class="secondary hidden" id="messageButton">Message</button><button class="secondary" id="followButton">Follow</button></div>
          <h2 id="profileName">Profile</h2>
          <div id="profileHandle" class="muted">@...</div>
          <p id="profileBio"></p>
          <div class="profile-stats"><strong id="followingCount">0</strong> Following &nbsp; <strong id="followerCount">0</strong> Followers</div>
        </div>
      </section>
      <section id="profileFeed" class="feed"></section>
    </main>

    <aside class="rightbar"><section class="panel"><h2>SiarnoWatch</h2><p>Real profiles, posts, likes and follows.</p></section></aside>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
