<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/swlogo.png" />
  <title>Post · SiarnoWatch</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="post">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html"><img class="brand-logo" src="assets/swlogo.png" alt="" /><span class="brand-text">SiarnoWatch</span></a>
      <nav class="nav">
        <a class="nav-item" href="index.html">⌂ <span>Home</span></a>
        <a class="nav-item" href="notifications.html">♡ <span>Notifications</span><b class="nav-badge hidden" data-notification-badge>0</b></a>
        <a class="nav-item" data-profile-link href="profile.html">◎ <span>Profile</span></a>
      </nav>
      <button class="account-button" data-auth-button>Log in</button>
      <div class="sidebar-footer">Mini social media.</div>
    </aside>
    <main class="feed-column">
      <header class="topbar profile-topbar"><a class="back" href="index.html">←</a><div><h1>Post</h1><p>One tiny piece of the Mini world.</p></div></header>
      <section id="singlePost" class="feed"></section>

      <section class="comments-section">
        <div class="comments-head">
          <h2>Comments</h2>
          <span id="commentSectionCount">0 comments</span>
        </div>
        <form id="commentForm" class="comment-form">
          <div class="avatar avatar-current comment-form-avatar">?</div>
          <div class="comment-form-main">
            <textarea id="commentText" maxlength="280" placeholder="Write a Mini reply…" required></textarea>
            <div class="comment-form-actions">
              <span id="commentCharCount">0 / 280</span>
              <button id="commentSubmit" class="primary" type="submit">Reply</button>
            </div>
          </div>
        </form>
        <div id="commentsList" class="comments-list"></div>
      </section>
    </main>
    <aside class="rightbar"><section class="panel"><h2>Real feed</h2><p>Posts, likes and comments are shared live through Firebase.</p></section></aside>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
