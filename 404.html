<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 · SiarnoWatch</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg, #0b0f14);
    }
    .error-card {
      width: min(560px, 100%);
      text-align: center;
      padding: 48px 28px;
      border: 1px solid var(--border, #29313a);
      border-radius: 24px;
      background: var(--panel, #10161d);
    }
    .error-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-weight: 800;
      font-size: 20px;
    }
    .error-brand .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-weight: 900;
    }
    .error-code {
      font-size: clamp(72px, 18vw, 132px);
      line-height: .9;
      margin: 8px 0 20px;
      letter-spacing: -0.06em;
    }
    .error-card h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    .error-card p {
      margin: 0 auto 28px;
      max-width: 420px;
      color: var(--muted, #9aa6b2);
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .error-actions a,
    .error-actions button {
      min-width: 140px;
      text-decoration: none;
    }
    .mini-note {
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted, #9aa6b2);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <div class="error-brand">
        <span class="brand-mark">S</span>
        <span>SiarnoWatch</span>
      </div>

      <div class="error-code">404</div>
      <h1>This page escaped the Mini world. 😭</h1>
      <p>
        The page, post, or profile you were looking for doesn't exist,
        was deleted, or took the wrong route.
      </p>

      <div class="error-actions">
        <a class="primary" href="index.html">⌂ Go Home</a>
        <button class="secondary" type="button" onclick="history.back()">← Go Back</button>
      </div>

      <div class="mini-note">Maximum Mini. Minimum found.</div>
    </section>
  </main>
</body>
</html>
